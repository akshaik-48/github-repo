<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Agent Dashboard</title>
  <style>
    :root {
      --bg: #1c1940;
      --bg-soft: #252254;
      --ink: #f1f4ff;
      --muted: #b2b9d8;
      --card: #2d2d5b;
      --card-strong: #323469;
      --line: #3f4278;
      --pill: #3f4373;
      --blue-1: #17d7ff;
      --blue-2: #21b6ff;
      --blue-3: #4cc3ff;
      --blue-4: #80d5ff;
      --green: #2fd37c;
      --amber: #f0ce5a;
      --red: #ff708b;
      --shadow: 0 14px 26px rgba(5, 9, 24, 0.36);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #2a285f 0, transparent 32%),
        radial-gradient(circle at 100% 0%, #2a2f66 0, transparent 30%),
        var(--bg);
      min-height: 100vh;
    }

    .shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 16px 26px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 3.5vw, 42px);
      line-height: 1.06;
      letter-spacing: 0;
      font-weight: 800;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 900px;
      font-size: 14px;
    }

    .hero-actions {
      min-width: 210px;
      text-align: right;
    }

    .last-updated {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
      display: block;
    }

    .btn {
      border: 1px solid #5a5fa0;
      background: #3a3f74;
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .btn:hover {
      background: #454b86;
      transform: translateY(-1px);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi {
      background: linear-gradient(180deg, #34366d 0%, var(--card) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 10px 14px;
      min-height: 88px;
      position: relative;
      overflow: hidden;
    }

    .kpi::after {
      content: "";
      position: absolute;
      right: -18px;
      top: -18px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(76, 195, 255, 0.18), rgba(76, 195, 255, 0));
    }

    .kpi-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: block;
    }

    .kpi-value {
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      margin-right: 8px;
    }

    .kpi-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .trend {
      font-size: 13px;
      font-weight: 700;
      margin-left: 4px;
      vertical-align: top;
    }

    .up { color: var(--green); }
    .warn { color: var(--amber); }
    .down { color: var(--red); }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .panel {
      background: linear-gradient(180deg, #313466 0%, var(--card) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      position: relative;
      padding: 22px 16px 14px;
      min-height: 264px;
    }

    .panel-title {
      position: absolute;
      top: -15px;
      left: 18px;
      right: 18px;
      text-align: center;
      background: var(--pill);
      color: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 23px;
      letter-spacing: 0.01em;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
    }

    .panel-subtitle {
      margin: 8px 0 14px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .donut-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .donut {
      width: 178px;
      height: 178px;
      border-radius: 50%;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: grow 650ms ease both;
    }

    .donut::before {
      content: "";
      position: absolute;
      inset: 38px;
      background: #282858;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      z-index: 2;
      text-align: center;
      line-height: 1.15;
    }

    .legend {
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: 128px;
    }

    .legend li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .chip {
      display: inline-flex;
      width: 11px;
      height: 11px;
      border-radius: 99px;
      margin-right: 6px;
      flex: 0 0 auto;
    }

    .legend-label {
      display: inline-flex;
      align-items: center;
      max-width: 165px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-value { color: #e6ebff; font-weight: 700; }

    .bars {
      margin-top: 4px;
      padding: 0 8px;
    }

    .bar-row {
      margin: 10px 0;
      display: grid;
      grid-template-columns: 84px 1fr 44px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .bar-track {
      height: 16px;
      border-radius: 999px;
      background: #24254f;
      overflow: hidden;
      border: 1px solid #464977;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue-1), var(--blue-3));
      transition: width 400ms ease;
    }

    .status-grid {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .status-cell {
      background: #2a2b58;
      border: 1px solid #444878;
      border-radius: 12px;
      padding: 8px 10px;
    }

    .status-cell .name {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-cell .count {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      margin-top: 5px;
    }

    .table-panel {
      background: linear-gradient(180deg, #313466 0%, var(--card) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      position: relative;
      padding: 22px 0 8px;
      overflow: hidden;
    }

    .table-title {
      position: absolute;
      top: -15px;
      left: 100px;
      right: 100px;
      text-align: center;
      background: var(--pill);
      color: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.01em;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
    }

    .table-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 8px 16px 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      border: 1px solid #555b90;
      background: #343969;
      color: #e4e8ff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .filter-btn.active {
      background: #4a4f88;
      color: #fff;
      border-color: #7077bf;
    }

    .table-wrap {
      overflow-x: auto;
      padding: 0 12px 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 940px;
    }

    th, td {
      text-align: left;
      border-bottom: 1px solid #3f4278;
      padding: 10px 8px;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      color: #9da6d0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
      font-weight: 800;
      position: sticky;
      top: 0;
      background: #2f315f;
      z-index: 2;
    }

    tbody tr:hover { background: #3a3d70; }
    tbody tr.main-row { cursor: pointer; }

    .status-badge {
      border-radius: 999px;
      display: inline-block;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .s-completed { background: rgba(47, 211, 124, 0.16); color: #a4ffc7; }
    .s-accepted { background: rgba(33, 182, 255, 0.17); color: #bcecff; }
    .s-ignored { background: rgba(154, 164, 205, 0.2); color: #d7defd; }
    .s-rejected { background: rgba(255, 112, 139, 0.2); color: #ffd0d8; }
    .s-received { background: rgba(240, 206, 90, 0.22); color: #fff1ad; }
    .s-unknown { background: rgba(154, 164, 205, 0.2); color: #d7defd; }

    .risk-low { color: #95f4bf; font-weight: 700; }
    .risk-medium { color: #ffea94; font-weight: 700; }
    .risk-high, .risk-critical { color: #ffc1cb; font-weight: 700; }
    .muted { color: var(--muted); }

    .detail-row { background: #2a2d59; }
    .detail-cell { padding: 0; }
    .detail-inner {
      padding: 10px 12px 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .trail-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .trail-pill {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #5a5f95;
      background: #343869;
    }

    .trail-pill.done { border-color: rgba(14, 165, 93, 0.35); color: #087247; }
    .trail-pill.running { border-color: rgba(203, 138, 5, 0.35); color: #8b5f07; }
    .trail-pill.fallback,
    .trail-pill.error,
    .trail-pill.failed,
    .trail-pill.rejected { border-color: rgba(201, 59, 59, 0.35); color: #9f2323; }

    .trail-events {
      max-height: 180px;
      overflow: auto;
      background: #252754;
      border: 1px solid #4c5184;
      border-radius: 12px;
      padding: 8px;
      font-size: 12px;
      color: #d5dcff;
    }

    .trail-events div {
      border-bottom: 1px dashed #464a79;
      padding: 4px 0;
    }

    .trail-events div:last-child { border-bottom: 0; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px;
      font-size: 14px;
    }

    .footer-note {
      margin-top: 14px;
      text-align: center;
      color: #9ca5ce;
      font-size: 12px;
    }

    @keyframes grow {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 1090px) {
      .analysis-grid { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .table-title { left: 20px; right: 20px; }
      .hero { flex-direction: column; }
      .hero-actions { text-align: left; }
    }

    @media (max-width: 620px) {
      .shell { padding: 16px 10px 20px; }
      .kpis { grid-template-columns: 1fr; }
      .donut-wrap { flex-direction: column; }
      .table-panel { border-radius: 18px; }
      .table-title { font-size: 18px; }
      .panel-title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const STAGE_ORDER = ["ingest", "metadata", "diff", "rules", "risk", "pr_checks", "llm_summary", "merge_readiness", "persist", "auto_merge", "review_comments"];
    const STATUS_ORDER = ["all", "completed", "accepted", "ignored", "rejected", "received", "unknown"];
    const STATUS_COLORS = {
      completed: "#158c55",
      accepted: "#1589b7",
      ignored: "#6b7280",
      rejected: "#c93b3b",
      received: "#cb8a05",
      unknown: "#525c6e"
    };

    function timeAgo(iso) {
      const then = new Date(iso).getTime();
      const sec = Math.floor((Date.now() - then) / 1000);
      if (Number.isNaN(sec)) return "-";
      if (sec < 60) return sec + "s ago";
      if (sec < 3600) return Math.floor(sec / 60) + "m ago";
      if (sec < 86400) return Math.floor(sec / 3600) + "h ago";
      return Math.floor(sec / 86400) + "d ago";
    }

    function normalizedStatus(run) {
      const raw = String(run.final_status || "").trim().toLowerCase();
      if (!raw) return "unknown";
      if (raw.includes("complete")) return "completed";
      if (raw.includes("accept")) return "accepted";
      if (raw.includes("reject") || raw.includes("fail")) return "rejected";
      if (raw.includes("ignore") || raw.includes("skip")) return "ignored";
      if (raw.includes("receive") || raw.includes("start")) return "received";
      return raw;
    }

    function matchesFilterStatus(run, filterStatus) {
      const status = normalizedStatus(run);
      if (filterStatus === "all") return true;
      return status === filterStatus;
    }

    function riskClass(level) {
      const value = String(level || "").toLowerCase();
      if (!value) return "muted";
      if (value === "critical") return "risk-critical";
      if (value === "high") return "risk-high";
      if (value === "medium") return "risk-medium";
      return "risk-low";
    }

    async function fetchAllRuns() {
      const pageSize = 200;
      const merged = [];
      let offset = 0;
      while (true) {
        const response = await fetch(`/pr-analysis/recent?limit=${pageSize}&offset=${offset}`);
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "request failed");
        }
        const page = await response.json();
        if (!Array.isArray(page) || page.length === 0) break;
        merged.push(...page);
        if (page.length < pageSize) break;
        offset += pageSize;
      }
      return merged;
    }

    function aggregateCounts(runs, keyFn) {
      const map = new Map();
      runs.forEach((run) => {
        const key = keyFn(run);
        map.set(key, (map.get(key) || 0) + 1);
      });
      return map;
    }

    function donutGradient(entries, palette) {
      const total = entries.reduce((acc, entry) => acc + entry.count, 0);
      if (!total) return "conic-gradient(#dce3ee 0 100%)";
      let start = 0;
      const parts = entries.map((entry, index) => {
        const pct = (entry.count / total) * 100;
        const end = start + pct;
        const color = palette[index % palette.length];
        const chunk = `${color} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
        start = end;
        return chunk;
      });
      return `conic-gradient(${parts.join(",")})`;
    }

    function App() {
      const [allRuns, setAllRuns] = React.useState([]);
      const [activeStatus, setActiveStatus] = React.useState("all");
      const [lastUpdated, setLastUpdated] = React.useState("Loading...");
      const [loadError, setLoadError] = React.useState("");
      const [expanded, setExpanded] = React.useState({});
      const [trailData, setTrailData] = React.useState({});

      const loadDashboard = React.useCallback(async () => {
        try {
          const runs = await fetchAllRuns();
          setAllRuns(runs);
          setLoadError("");
          setLastUpdated("Updated " + new Date().toLocaleTimeString());
        } catch (error) {
          setLoadError(error.message || String(error));
        }
      }, []);

      React.useEffect(() => {
        loadDashboard();
        const timer = setInterval(loadDashboard, 10000);
        return () => clearInterval(timer);
      }, [loadDashboard]);

      const filteredRuns = React.useMemo(() => {
        return allRuns.filter((run) => matchesFilterStatus(run, activeStatus));
      }, [allRuns, activeStatus]);

      const statusEntries = React.useMemo(() => {
        const statusCounts = aggregateCounts(allRuns, normalizedStatus);
        return Array.from(statusCounts.entries())
          .map(([label, count]) => ({ label, count }))
          .sort((a, b) => b.count - a.count);
      }, [allRuns]);

      const providerEntries = React.useMemo(() => {
        const providerCounts = aggregateCounts(allRuns, (run) => String(run.provider || "unknown").toLowerCase());
        return Array.from(providerCounts.entries())
          .map(([label, count]) => ({ label, count }))
          .sort((a, b) => b.count - a.count);
      }, [allRuns]);

      const riskEntries = React.useMemo(() => {
        const riskCounts = aggregateCounts(
          allRuns.filter((run) => run.risk_level),
          (run) => String(run.risk_level || "unknown").toLowerCase()
        );
        return ["critical", "high", "medium", "low"].map((level) => ({ level, count: riskCounts.get(level) || 0 }));
      }, [allRuns]);

      const kpis = React.useMemo(() => {
        const total = allRuns.length;
        const completed = allRuns.filter((run) => normalizedStatus(run) === "completed").length;
        const accepted = allRuns.filter((run) => normalizedStatus(run) === "accepted").length;
        const ignored = allRuns.filter((run) => normalizedStatus(run) === "ignored").length;
        const withAnalysis = allRuns.filter((run) => run.analysis_id != null).length;
        const warningRuns = allRuns.filter((run) => (run.error_count + run.fallback_count) > 0).length;
        const completionRate = total ? Math.round((completed / total) * 100) : 0;
        return [
          { label: "Total Runs", value: total, sub: "All PR and MR deliveries", trendClass: "" },
          { label: "Completed", value: completed, sub: completionRate + "% pipeline completion", trendClass: "up" },
          { label: "Accepted", value: accepted, sub: "Passed ingest gate", trendClass: "up" },
          { label: "Ignored", value: ignored, sub: "Unsupported or skipped actions", trendClass: ignored ? "warn" : "" },
          { label: "Analyses", value: withAnalysis, sub: warningRuns + " with warning signals", trendClass: warningRuns ? "down" : "" },
        ];
      }, [allRuns]);

      const quality = React.useMemo(() => {
        const warningRuns = allRuns.filter((run) => (run.fallback_count + run.error_count) > 0).length;
        const errorSum = allRuns.reduce((sum, run) => sum + (run.error_count || 0), 0);
        const fallbackSum = allRuns.reduce((sum, run) => sum + (run.fallback_count || 0), 0);
        const analyzed = allRuns.filter((run) => run.analysis_id != null).length;
        return [
          { name: "Warning runs", value: warningRuns },
          { name: "Total errors", value: errorSum },
          { name: "Fallbacks", value: fallbackSum },
          { name: "With analysis", value: analyzed },
        ];
      }, [allRuns]);

      const ensureTrailLoaded = React.useCallback(async (deliveryId) => {
        if (trailData[deliveryId] && !trailData[deliveryId].loading) return;
        setTrailData((prev) => ({ ...prev, [deliveryId]: { loading: true, data: null, error: "" } }));
        try {
          const response = await fetch(`/pr-analysis/events/${encodeURIComponent(deliveryId)}`);
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || "unable to load events");
          }
          const data = await response.json();
          setTrailData((prev) => ({ ...prev, [deliveryId]: { loading: false, data, error: "" } }));
        } catch (error) {
          setTrailData((prev) => ({ ...prev, [deliveryId]: { loading: false, data: null, error: error.message || String(error) } }));
        }
      }, [trailData]);

      const toggleRow = React.useCallback((deliveryId) => {
        setExpanded((prev) => {
          const next = { ...prev, [deliveryId]: !prev[deliveryId] };
          return next;
        });
      }, []);

      React.useEffect(() => {
        Object.keys(expanded).forEach((deliveryId) => {
          if (expanded[deliveryId]) ensureTrailLoaded(deliveryId);
        });
      }, [expanded, ensureTrailLoaded]);

      const statusPalette = statusEntries.map((entry) => STATUS_COLORS[entry.label] || STATUS_COLORS.unknown);
      const providerPalette = ["#0c6080", "#42bce8", "#8cdaf4", "#123746"];
      const riskTotal = riskEntries.reduce((acc, item) => acc + item.count, 0);

      return (
        <div className="shell">
          <section className="hero">
            <div>
              <h1>PR campaign dashboard for delivery analysis</h1>
              <p>
                Unified view of every PR and MR run so far, including completed, accepted, ignored, and rejected runs,
                with risk and pipeline-stage diagnostics.
              </p>
            </div>
            <div className="hero-actions">
              <span className="last-updated">{lastUpdated}</span>
              <button className="btn" onClick={loadDashboard}>Refresh dashboard</button>
            </div>
          </section>

          <section className="kpis">
            {kpis.map((item) => (
              <article className="kpi" key={item.label}>
                <span className="kpi-label">{item.label}</span>
                <span className="kpi-value">{item.value}</span>
                {item.trendClass ? <span className={`trend ${item.trendClass}`}>+</span> : null}
                <div className="kpi-sub">{item.sub}</div>
              </article>
            ))}
          </section>

          <section className="analysis-grid">
            <article className="panel">
              <div className="panel-title">Final Status Share</div>
              <div className="panel-subtitle">All runs by final pipeline status</div>
              <div className="donut-wrap">
                <div className="donut" style={{ background: donutGradient(statusEntries, statusPalette) }}>
                  <div className="donut-center">{allRuns.length}</div>
                </div>
                <ul className="legend">
                  {statusEntries.map((entry, index) => {
                    const total = allRuns.length || 1;
                    const pct = Math.round((entry.count / total) * 100);
                    return (
                      <li key={entry.label}>
                        <span className="legend-label">
                          <span className="chip" style={{ background: statusPalette[index % statusPalette.length] }}></span>
                          {entry.label}
                        </span>
                        <span className="legend-value">{entry.count} ({pct}%)</span>
                      </li>
                    );
                  })}
                </ul>
              </div>
            </article>

            <article className="panel">
              <div className="panel-title">Provider Share</div>
              <div className="panel-subtitle">GitHub and GitLab contribution</div>
              <div className="donut-wrap">
                <div className="donut" style={{ background: donutGradient(providerEntries, providerPalette) }}>
                  <div className="donut-center">{providerEntries.length}</div>
                </div>
                <ul className="legend">
                  {providerEntries.map((entry, index) => {
                    const total = allRuns.length || 1;
                    const pct = Math.round((entry.count / total) * 100);
                    return (
                      <li key={entry.label}>
                        <span className="legend-label">
                          <span className="chip" style={{ background: providerPalette[index % providerPalette.length] }}></span>
                          {entry.label}
                        </span>
                        <span className="legend-value">{entry.count} ({pct}%)</span>
                      </li>
                    );
                  })}
                </ul>
              </div>
            </article>

            <article className="panel">
              <div className="panel-title">Risk and Quality</div>
              <div className="panel-subtitle">Risk distribution and warning indicators</div>
              <div className="bars">
                {riskEntries.map((item) => {
                  const width = riskTotal ? Math.round((item.count / riskTotal) * 100) : 0;
                  const color = item.level === "critical" ? "#c93b3b" : item.level === "high" ? "#df5858" : item.level === "medium" ? "#cb8a05" : "#0ea55d";
                  return (
                    <div className="bar-row" key={item.level}>
                      <div>{item.level}</div>
                      <div className="bar-track">
                        <div className="bar-fill" style={{ width: width + "%", background: `linear-gradient(90deg, ${color}, ${color})` }}></div>
                      </div>
                      <div className="legend-value">{item.count}</div>
                    </div>
                  );
                })}
              </div>
              <div className="status-grid">
                {quality.map((item) => (
                  <div className="status-cell" key={item.name}>
                    <div className="name">{item.name}</div>
                    <div className="count">{item.value}</div>
                  </div>
                ))}
              </div>
            </article>
          </section>

          <section className="table-panel">
            <div className="table-title">PR and MR Timeline</div>
            <div className="table-toolbar">
              <div className="filters">
                {STATUS_ORDER.map((status) => {
                  const count = status === "all"
                    ? allRuns.length
                    : allRuns.filter((run) => matchesFilterStatus(run, status)).length;
                  return (
                    <button
                      key={status}
                      className={activeStatus === status ? "filter-btn active" : "filter-btn"}
                      onClick={() => setActiveStatus(status)}
                    >
                      {status} ({count})
                    </button>
                  );
                })}
              </div>
              <div className="muted">{filteredRuns.length} visible of {allRuns.length} total</div>
            </div>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>PR / MR</th>
                    <th>Provider</th>
                    <th>Status</th>
                    <th>Risk</th>
                    <th>Analysis</th>
                    <th>Warnings</th>
                    <th>Received</th>
                  </tr>
                </thead>
                <tbody>
                  {loadError ? (
                    <tr><td className="empty" colSpan="7">Failed to load runs: {loadError}</td></tr>
                  ) : filteredRuns.length === 0 ? (
                    <tr><td className="empty" colSpan="7">No runs match this filter.</td></tr>
                  ) : (
                    filteredRuns.map((run) => {
                      const status = normalizedStatus(run);
                      const isExpanded = !!expanded[run.delivery_id];
                      const trail = trailData[run.delivery_id];
                      const warnings = (run.error_count || 0) + (run.fallback_count || 0);
                      const byStage = new Map();
                      if (trail && trail.data && Array.isArray(trail.data.events)) {
                        trail.data.events.forEach((event) => {
                          if (event.stage) byStage.set(event.stage, event.status || "unknown");
                        });
                      }

                      return (
                        <React.Fragment key={run.delivery_id}>
                          <tr className="main-row" onClick={() => toggleRow(run.delivery_id)}>
                            <td><strong>#{run.pr_number}</strong> <span className="muted">{run.owner}/{run.repo}</span></td>
                            <td>{run.provider}</td>
                            <td><span className={`status-badge s-${STATUS_COLORS[status] ? status : "unknown"}`}>{status}</span></td>
                            <td>
                              {run.risk_score == null ? (
                                <span className="muted">Not analyzed</span>
                              ) : (
                                <span className={riskClass(run.risk_level)}>{run.risk_score} ({run.risk_level})</span>
                              )}
                            </td>
                            <td>{run.analysis_id == null ? "-" : run.analysis_id}</td>
                            <td>{warnings ? <span className="warn">{warnings}</span> : <span className="muted">0</span>}</td>
                            <td className="muted">{timeAgo(run.received_at)}</td>
                          </tr>
                          {isExpanded ? (
                            <tr className="detail-row">
                              <td className="detail-cell" colSpan="7">
                                <div className="detail-inner">
                                  {trail && trail.loading ? (
                                    <div className="muted">Loading events...</div>
                                  ) : trail && trail.error ? (
                                    <div className="muted">Failed to load events: {trail.error}</div>
                                  ) : (
                                    <>
                                      <div className="trail-pills">
                                        {STAGE_ORDER.filter((stage) => byStage.has(stage)).map((stage) => {
                                          const stageStatus = String(byStage.get(stage) || "unknown").toLowerCase();
                                          return <span key={stage} className={`trail-pill ${stageStatus}`}>{stage}: {stageStatus}</span>;
                                        })}
                                      </div>
                                      <div className="trail-events">
                                        {(trail && trail.data && Array.isArray(trail.data.events) ? trail.data.events.slice(-6).reverse() : []).map((event, idx) => {
                                          const stageLabel = event.stage ? `${event.stage} ` : "";
                                          const statusLabel = event.status || event.event_type;
                                          const details = event.detail && Object.keys(event.detail).length ? ` ${JSON.stringify(event.detail)}` : "";
                                          return <div key={`${run.delivery_id}-${idx}`}><strong>{stageLabel + statusLabel}</strong>{details}</div>;
                                        })}
                                      </div>
                                      <div className="muted">Delivery: {run.delivery_id} | Final status: {trail && trail.data ? trail.data.final_status : status}</div>
                                    </>
                                  )}
                                </div>
                              </td>
                            </tr>
                          ) : null}
                        </React.Fragment>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </section>

          <div className="footer-note">Auto refresh every 10 seconds. Click any row to inspect pipeline events and stage trail.</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
